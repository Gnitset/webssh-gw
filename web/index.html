<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSH Gateway</title>
<link rel="stylesheet" href="xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bar">
  <select id="protocol">
    <option value="ssh">SSH</option>
    <option value="vnc">VNC</option>
    <option value="rdp">RDP</option>
  </select>
  <input id="host" placeholder="host / ip" size="18" autocomplete="off">
  <input id="port" placeholder="port" value="{{DEFAULT_PORT}}" size="5" autocomplete="off">
  <input id="user" placeholder="user" value="{{DEFAULT_USER}}" size="12" autocomplete="off">
  <select id="authType">
    <option value="password">password</option>
    <option value="key">private key</option>
  </select>
  <input id="password" type="password" placeholder="password" size="14">
  <input id="passphrase" type="password" placeholder="key passphrase" size="14" style="display:none">
  <button id="connect">connect</button>
  <button id="disconnect" disabled>disconnect</button>
  <button id="fullscreen" title="Enter fullscreen so browser shortcuts like Ctrl+W reach the terminal instead of the browser">fullscreen</button>
  <span id="status"></span>
  <a href="logout" id="logout">logout</a>
</div>
<textarea id="key" placeholder="paste OpenSSH private key (PEM) here" style="display:none"></textarea>
<div id="term" data-scrollback="{{SCROLLBACK}}"></div>
<div id="vnc" style="display:none"></div>
<div id="rdp" style="display:none"><canvas id="rdpCanvas" tabindex="0"></canvas></div>

<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="wasm_exec.js"></script>
<script type="module" src="novnc-bridge.js"></script>
<script type="module" src="iron-rdp-bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
